version: 2.1

jobs:
  retry_cd-01:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: brush grain
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; yes abc | head -n 1344330 | sha1sum > /tmp/share/relay.state; true
            len=$(wc -c </tmp/share/relay.state); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - relay.state
  cd-01:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Grab gate output
          command: |
            wc -c /tmp/share/relay.state || true
      - run:
          name: Get source tree
          command: git clone -q https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: tar xf ci-artifacts.tar
      - run:
          name: Collect artifacts
          command: mkdir -p artifacts
      - run:
          command: g++ --version
      - run:
          name: Workspace summary
          command: date -u
      - run:
          no_output_timeout: 77m
          command: nice -n 0 ./tool
